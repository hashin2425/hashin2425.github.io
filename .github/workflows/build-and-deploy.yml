name: Deploy to GitHub Pages

# 実行中にPushされたら停止する
concurrency:
  group: "pages"
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    # サイトの出力に影響しないファイルだけを除外する。
    # 以前は JS/TS だけを許可リストで指定していたため、画像・CSS・configs/・public/・
    # package.json・ロックファイル・next.config.* などの変更で再デプロイされなかった。
    # 許可リストは追加漏れが「デプロイされない」側に倒れるので、除外リスト方式にしている。
    paths-ignore:
      # ビルド成果物そのもの（このワークフローが push する）
      - 'docs/**'
      - '**/*.md'
      - '.vscode/**'
      - '.github/dependabot.yml'
      - '.github/workflows/dependabot-build-check.yml'
  workflow_dispatch:

# 既定は読み取りのみ。書き込みが必要なジョブだけ個別に権限を付ける
permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # ビルド成果物をリポジトリへ push するため
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CI: false

      - name: Move build to docs
        run: |
          rm -rf ./docs/
          mkdir ./docs
          mv ./out/* ./docs/
          cp ./configs/* ./docs/

      # アンダースコアから始まるディレクトリが無視される不具合によってアイコンが404NotFoundになる
      # その不具合を避けるために、`.nojekyll`を追加する
      - name: add .nojekyll
        run: touch ./docs/.nojekyll

      # ここまでの作業をReleaseブランチ上で反映させる
      - name: Commit and push
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add -A
          git commit -m "Push build result [skip ci]"
          git push
